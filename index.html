<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles.css">
    <title>BM Teacher Battle</title>
  </head>

  <body>
    <div id="game">
      
      <!-- Statistics -->
      <div id="stats">
        <span class="stat">XP: <strong><span id="xpText">0</span></strong></span>
        <span class="stat">Health: <strong><span id="healthText">0</span></strong></span>
        <span class="stat">Gold: <strong><span id="goldText">0</span></strong></span>
      </div>

      <!-- Game image -->
      <div id="content">
        <img id="img" src="start.png" class="center">
      </div>

      <!-- Buttons -->
      <div id="controls">
        <button id="button1">Go to Shop</button>
        <button id="button1">Go to Science Department</button>
        <button id="button1">Go to Maths Department</button>
        <button id="button1">Fight Ms McFall</button>
      </div>

      <!-- Monster Information -->
      <div id="monsterStats">
        <span class="stat">Teacher Name: <strong><span id="mosterName"></span></strong></span>
        <span class="stat">Health: <strong><span id="monsterHealth"></span></strong></span>
      </div>
      
      <!-- Instructions and stuff -->
      <div id="text">
        Welcome to the BM Teacher Battle Arena! You are in the dining room.
        Where do you want to go? Use the buttons above.
      </div>
      
    </div>

    <!-- Sound Effects -->
    <audio id="attackSound" src="attackSound.mp3"></audio>
    <audio id="breakSound" src="breakSound.mp3"></audio>
    <audio id="defendSound" src="defendSound.mp3"></audio>
    <audio id="fightSound" src="fightSound.mp3"></audio>
    <script src="app.js"></script>
  </body>

</html>
